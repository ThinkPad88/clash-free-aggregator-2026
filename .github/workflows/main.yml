name: Build Multi-Client Subscription

on:
  workflow_dispatch:
  schedule:
    # Every 2 calendar days at 03:17 UTC.
    - cron: "17 3 */2 * *"
  push:
    paths:
      - "src/**"
      - "config/**"
      - ".github/workflows/**"

permissions:
  contents: write

concurrency:
  group: subscription-build
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build subscriptions
        run: python src/aggregator.py

      - name: Validate generated subscriptions
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import base64
          import ipaddress
          import re
          import yaml

          root = Path("dist")
          clash = root / "clash.yaml"
          openclash = root / "openclash.yaml"
          v2 = root / "v2rayn.txt"

          if not clash.exists() or not openclash.exists() or not v2.exists():
              raise SystemExit("Required output file is missing")

          doc = yaml.safe_load(clash.read_text(encoding="utf-8"))
          if not isinstance(doc, dict):
              raise SystemExit("clash.yaml is not a YAML mapping")
          proxies = doc.get("proxies")
          groups = doc.get("proxy-groups")
          rules = doc.get("rules")
          if not isinstance(proxies, list) or not proxies:
              raise SystemExit("clash.yaml contains no proxies")
          if not isinstance(groups, list) or not groups:
              raise SystemExit("clash.yaml contains no proxy-groups")
          if not isinstance(rules, list) or not rules:
              raise SystemExit("clash.yaml contains no rules")

          names = [p.get("name") for p in proxies if isinstance(p, dict)]
          if len(names) != len(set(names)):
              raise SystemExit("Duplicate proxy names detected")

          def valid_host(value):
              if not isinstance(value, str) or not value or len(value) > 253:
                  return False
              if any(ord(c) < 32 or ord(c) > 126 for c in value):
                  return False
              if "/" in value or "%" in value or "://" in value:
                  return False
              if value.lower() in {"off", "false", "null", "none"}:
                  return False
              try:
                  ipaddress.ip_address(value)
                  return True
              except ValueError:
                  pass
              labels = value.rstrip(".").split(".")
              return bool(labels) and all(re.fullmatch(r"[A-Za-z0-9](?:[A-Za-z0-9-]{0,61}[A-Za-z0-9])?", x) for x in labels)

          for p in proxies:
              if not isinstance(p, dict):
                  raise SystemExit("Proxy entry is not a mapping")
              typ = str(p.get("type", "")).lower()
              if typ == "hysteria2":
                  if "tls" in p:
                      raise SystemExit(f"Hysteria2 contains unsupported tls field: {p.get('name')}")
                  if "sni" in p and not valid_host(str(p["sni"])):
                      raise SystemExit(f"Invalid Hysteria2 SNI: {p.get('name')}: {p.get('sni')}")
              if typ == "vless" and p.get("flow") == "xtls-rprx-vision" and not isinstance(p.get("reality-opts"), dict):
                  raise SystemExit(f"VLESS Vision node has no reality-opts: {p.get('name')}")

          proxy_names = set(names)
          group_names = {g.get("name") for g in groups if isinstance(g, dict)}
          known = proxy_names | group_names | {"DIRECT", "REJECT", "PASS", "COMPATIBLE"}
          for g in groups:
              for ref in g.get("proxies", []) if isinstance(g, dict) else []:
                  if ref not in known:
                      raise SystemExit(f"Broken proxy-group reference: {g.get('name')} -> {ref}")

          # v2rayN subscription must be Base64 of newline-separated standard URIs.
          encoded = v2.read_text(encoding="ascii").strip()
          decoded = base64.b64decode(encoded + "=" * ((4 - len(encoded) % 4) % 4)).decode("utf-8")
          uris = [x.strip() for x in decoded.splitlines() if x.strip()]
          if not uris:
              raise SystemExit("v2rayn.txt contains no share links")
          allowed = ("vless://", "vmess://", "trojan://", "ss://", "hysteria2://", "tuic://", "socks://")
          bad = [u for u in uris if not u.lower().startswith(allowed)]
          if bad:
              raise SystemExit(f"Unsupported v2rayN URI: {bad[0]}")

          # The OpenClash alias must remain byte-for-byte equivalent to the main YAML.
          if yaml.safe_load(openclash.read_text(encoding="utf-8")) != doc:
              raise SystemExit("openclash.yaml differs from clash.yaml")

          print(f"Mihomo/OpenClash: {len(proxies)} proxies, {len(groups)} groups")
          print(f"v2rayN: {len(uris)} share links")
          PY

      - name: Show build status
        run: cat dist/status.json

      - name: Commit generated subscriptions
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dist/
          if git diff --cached --quiet; then
            echo "No changes."
          else
            git commit -m "chore: refresh multi-client subscriptions"
            git push
          fi
